name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type-check & build
        # Runs with zero env vars — demo mode (in-memory data, keyword AI
        # fallback, demo login) — so CI never needs secrets to validate a build.
        run: npm run build
